name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources (no model downloads)
        run: python -m compileall -q *.py distill experiments native tools
      - name: Audit public Git contents
        run: python tools/audit_publication.py
